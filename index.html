<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cali Marketplace</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#ee4d2d;color:white;padding:18px 14px}
header h1{margin:0 0 12px;font-size:25px}
header p{margin:0}
.search{width:100%;padding:12px;border:0;border-radius:6px;margin-top:14px;font-size:16px}
nav{display:flex;gap:8px;padding:12px;overflow:auto;background:white}
button,.btn{border:0;padding:11px 14px;border-radius:6px;background:#ee4d2d;color:white;font-size:14px;cursor:pointer}
nav button{white-space:nowrap}
main{padding:14px;max-width:1000px;margin:auto}
h2{font-size:20px}
.categories{display:flex;gap:8px;overflow:auto;padding-bottom:12px}
.categories button{background:white;color:#333;border:1px solid #ddd}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:8px;overflow:hidden;padding-bottom:12px}
.photo{height:130px;background:#ffe5dd;display:flex;align-items:center;justify-content:center;font-size:45px}
.card h3{font-size:15px;margin:10px}
.price{color:#ee4d2d;font-weight:bold;margin:10px}
.card p{font-size:12px;margin:10px;color:#666}
.card button{margin:0 10px}
.panel{background:white;padding:16px;border-radius:8px;margin-top:16px}
input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:5px;font-size:15px}
footer{text-align:center;padding:25px;color:#777;font-size:12px}
.hidden{display:none}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.photo{height:170px}}
</style>
</head>
<body>
<header>
<h1>🛍️ Cali Marketplace</h1>
<p>Your finds, your style, your marketplace.</p>
<input id="search" class="search" placeholder="Search products..." oninput="renderProducts()">
</header>

<nav>
<button onclick="showPage('shop')">Shop</button>
<button onclick="showPage('sell')">Become a Seller</button>
<button onclick="showPage('orders')">My Orders</button>
<button onclick="showPage('admin')">Admin Demo</button>
</nav>

<main>
<section id="shop">
<h2>Shop by Category</h2>
<div class="categories" id="categories"></div>
<h2>Featured Products</h2>
<div class="grid" id="products"></div>
</section>

<section id="sell" class="hidden panel">
<h2>Seller Application</h2>
<p>Apply to sell on Cali Marketplace. Applications must be approved by the admin.</p>
<form id="sellerForm">
<label>Your name</label><input id="sellerName" required>
<label>Email</label><input id="sellerEmail" type="email" required>
<label>Store name</label><input id="storeName" required>
<label>What do you want to sell?</label><textarea id="sellerDescription" required></textarea>
<button type="submit">Submit Application</button>
</form>
<div id="sellerMessage"></div>
</section>

<section id="orders" class="hidden panel">
<h2>My Orders</h2>
<p id="orderMessage">No demo orders yet.</
